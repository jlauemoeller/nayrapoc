services:
  seaweedfs:
    # Pinned: bump deliberately after checking the release notes.
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs
    ports:
      # S3 API (8333 in the container) on host port 9000, matching OBJECT_STORAGE_ENDPOINT.
      - "127.0.0.1:9000:8333"
      # Admin UI
      - "127.0.0.1:23646:23646"
    volumes:
      - ./data/seaweedfs:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    # `weed mini` runs master, volume, filer and S3 gateway in one process, and
    # creates the listed buckets on startup if they don't exist.
    command: >
      mini -dir=/data
      -bucket=nayra-dev,nayra-test
      -s3.config=/etc/seaweedfs/s3.json
      -s3.allowedOrigins=http://localhost:3000
